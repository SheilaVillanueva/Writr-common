databaseChangeLog:

  - changeSet:
      id: 003-documento
      author: equipo
      changes:

        - createTable:
            tableName: documento
            columns:

              - column:
                  name: id_documento
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_documento

              - column:
                  name: id_usuario
                  type: UUID

              - column:
                  name: titulo
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: contenido
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: fecha_publicacion
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: publicado
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: documento
            baseColumnNames: id_usuario
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            constraintName: fk_documento_usuario
            onDelete: SET NULL

        - sql:
            sql: >
              ALTER TABLE documento
              ADD CONSTRAINT ck_documento_estado
              CHECK (estado IN ('publicado', 'marcado', 'eliminado'));

  - changeSet:
      id: 004-lista
      author: equipo
      changes:

        - createTable:
            tableName: lista
            columns:

              - column:
                  name: id_lista
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_lista

              - column:
                  name: id_usuario
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: nombre
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: descripcion
                  type: TEXT

              - column:
                  name: fecha_creacion
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: lista
            baseColumnNames: id_usuario
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            constraintName: fk_lista_usuario

  - changeSet:
      id: 005-lista-lectura-documento
      author: equipo
      changes:

        - createTable:
            tableName: lista_lectura_documento
            columns:

              - column:
                  name: id_lista_lectura_documento
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_lista_lectura_documento

              - column:
                  name: id_lista
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: id_documento
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: fecha_agregado
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: orden
                  type: INTEGER
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: lista_lectura_documento
            baseColumnNames: id_lista
            referencedTableName: lista
            referencedColumnNames: id_lista
            constraintName: fk_lld_lista
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: lista_lectura_documento
            baseColumnNames: id_documento
            referencedTableName: documento
            referencedColumnNames: id_documento
            constraintName: fk_lld_documento
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: lista_lectura_documento
            columnNames: id_lista, id_documento
            constraintName: uk_lista_documento

  - changeSet:
      id: 006-lista-lectura-usuario
      author: equipo
      changes:

        - createTable:
            tableName: lista_lectura_usuario
            columns:

              - column:
                  name: id_usuario
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_lista_lectura_usuario

              - column:
                  name: id_lista
                  type: INTEGER
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_lista_lectura_usuario

              - column:
                  name: fecha_union
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: lista_lectura_usuario
            baseColumnNames: id_usuario
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            constraintName: fk_llu_usuario
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: lista_lectura_usuario
            baseColumnNames: id_lista
            referencedTableName: lista
            referencedColumnNames: id_lista
            constraintName: fk_llu_lista
            onDelete: CASCADE