databaseChangeLog:

  - changeSet:
      id: 007-seguidor
      author: equipo
      changes:

        - createTable:
            tableName: seguidor
            columns:

              - column:
                  name: id_seguidor
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_seguidor

              - column:
                  name: id_seguido
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_seguidor

              - column:
                  name: fecha_inicio
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: aceptado
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: seguidor
            baseColumnNames: id_seguidor
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            constraintName: fk_seguidor_usuario
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: seguidor
            baseColumnNames: id_seguido
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            constraintName: fk_seguido_usuario
            onDelete: CASCADE

        - sql:
            sql: >
              ALTER TABLE seguidor
              ADD CONSTRAINT ck_seguidor_estado
              CHECK (estado IN ('aceptado', 'pendiente'));

        - sql:
            sql: >
              ALTER TABLE seguidor
              ADD CONSTRAINT ck_seguidor_distinto
              CHECK (id_seguidor <> id_seguido);

  - changeSet:
      id: 008-comentario
      author: equipo
      changes:

        - createTable:
            tableName: comentario
            columns:

              - column:
                  name: id_comentario
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_comentario

              - column:
                  name: id_documento
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: id_usuario
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: id_comentario_padre
                  type: INTEGER

              - column:
                  name: contenido
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: fecha
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: activo
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: comentario
            baseColumnNames: id_documento
            referencedTableName: documento
            referencedColumnNames: id_documento
            constraintName: fk_comentario_documento
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: comentario
            baseColumnNames: id_usuario
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            constraintName: fk_comentario_usuario

        - addForeignKeyConstraint:
            baseTableName: comentario
            baseColumnNames: id_comentario_padre
            referencedTableName: comentario
            referencedColumnNames: id_comentario
            constraintName: fk_comentario_padre

        - sql:
            sql: >
              ALTER TABLE comentario
              ADD CONSTRAINT ck_comentario_estado
              CHECK (estado IN ('activo', 'eliminado'));

