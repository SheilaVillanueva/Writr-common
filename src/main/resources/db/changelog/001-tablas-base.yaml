databaseChangeLog:

  - changeSet:
      id: 001-usuario
      author: equipo
      changes:

        - createTable:
            tableName: usuario
            columns:

              - column:
                  name: id_usuario
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_usuario

              - column:
                  name: nombre
                  type: VARCHAR(120)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_usuario_email

              - column:
                  name: id_helper_supervisor
                  type: UUID

              - column:
                  name: es_privada
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: comentarios_habilitados
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: cantidad_strikes
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: estado_cuenta
                  type: VARCHAR(30)
                  defaultValue: activo
                  constraints:
                    nullable: false

              - column:
                  name: fecha_marcado_eliminacion
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: fecha_registro
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: usuario
            baseColumnNames: id_usuario
            referencedTableName: users
            referencedTableSchemaName: auth
            referencedColumnNames: id
            constraintName: fk_usuario_auth
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: usuario
            baseColumnNames: id_helper_supervisor
            referencedTableName: usuario
            referencedColumnNames: id_usuario
            constraintName: fk_usuario_supervisor
            onDelete: SET NULL

        - sql:
            sql: >
              ALTER TABLE usuario
              ADD CONSTRAINT ck_usuario_estado
              CHECK (estado_cuenta IN ('activo', 'suspendido', 'marcado_para_eliminar'));

  - changeSet:
      id: 002-configuracion
      author: equipo
      changes:

        - createTable:
            tableName: configuracion
            columns:

              - column:
                  name: clave
                  type: VARCHAR(80)
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_configuracion

              - column:
                  name: valor
                  type: TEXT
                  constraints:
                    nullable: false